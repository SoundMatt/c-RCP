name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build and test (cross-platform matrix) ───────────────────────────────────
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: clang-14
            cc: clang-14
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
          - os: macos-14
            compiler: clang
            cc: clang
          - os: windows-2022
            compiler: msvc
            cc: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRELAY_BUILD_CLI=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -j1

      - name: Upload compile_commands.json (Linux clang-14 only)
        if: matrix.os == 'ubuntu-22.04' && matrix.compiler == 'clang-14'
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json

  # ── Dynamic memory-safety sanitizers (ASan/UBSan) ────────────────────────────
  #
  # A hard gate, not a report: this codebase parses untrusted, attacker-
  # controlled network frames (acf.c, wire-format decoders, discovery.c,
  # scheduler.c all index into declared-length fields from received bytes)
  # using unchecked pointer arithmetic throughout, as C99 requires -- static
  # lint (cfusa-lint/-analyze) cannot itself prove the absence of an
  # out-of-bounds read or integer-overflow-driven UB on a malformed input;
  # only exercising the actual decode paths under a runtime sanitizer can.
  # Runs the full test suite (which already exercises malformed/boundary
  # inputs in each module's own decoder tests) built with
  # -fsanitize=address,undefined; any sanitizer trap fails the job (issue
  # c-RCP-N2-04 / #131).
  sanitize:
    name: sanitizers (ASan/UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-14

      - name: Configure (ASan+UBSan)
        env:
          CC: clang-14
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test (ASan+UBSan, halt on first trapped error)
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure -j1

  # ── L2 (native Ethernet) transport: real veth round trip ─────────────────────
  #
  # tests/test_l2.c (part of build-and-test above) already covers the frame
  # codec (rcp_l2_frame_encode()/_decode()) unprivileged, on every platform.
  # This job is the real thing: two rcp_l2_avtp_transport_t instances bound
  # to opposite ends of an actual veth pair, moving actual AVTPDUs over
  # actual AF_PACKET/SOCK_RAW sockets, asserting byte-for-byte equality in
  # both directions (tests/l2_veth_roundtrip_test.c). Linux-only (l2.h's own
  # file header) and needs CAP_NET_RAW/root to open a raw socket at all, so
  # it runs as its own dedicated, `sudo`-using job rather than folding into
  # build-and-test's own unprivileged cross-platform matrix.
  l2-transport-veth:
    name: L2 transport (veth)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build iproute2

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build l2_veth_roundtrip
        run: cmake --build build --target l2_veth_roundtrip --parallel

      - name: Create veth pair
        run: |
          sudo ip link add veth0 type veth peer name veth1
          sudo ip link set veth0 up
          sudo ip link set veth1 up

      - name: Real L2 round trip over veth0/veth1
        run: sudo ./build/tests/l2_veth_roundtrip

  # ── RELAY conformance gate (spec §12, §17, §20.1) ────────────────────────────
  relay-conform:
    name: relay conform (RELAY §12 conformance)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout c-RCP
        uses: actions/checkout@v4

      - name: Checkout RELAY (authoritative conformance validator)
        uses: actions/checkout@v4
        with:
          repository: SoundMatt/RELAY
          path: RELAY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build relay conformance tool
        working-directory: RELAY
        run: go build -o "$RUNNER_TEMP/relay" ./cmd/relay

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Build c-rcp CLI
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DRELAY_BUILD_CLI=ON -G Ninja
          cmake --build build --target c-rcp --parallel

      - name: Run relay conform (strict)
        run: '"$RUNNER_TEMP/relay" conform --strict build/c-rcp'

  # ── TLA+ formal verification (issue #57) ─────────────────────────────────────
  formal-verification:
    name: formal verification (TLC model checking)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLC (tla2tools.jar)
        run: curl -sSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Model-check LifecycleStateMachine.tla
        working-directory: tla
        run: java -jar "$RUNNER_TEMP/tla2tools.jar" -workers 4 LifecycleStateMachine.tla

      - name: Model-check E2ESafePoint.tla
        working-directory: tla
        run: java -jar "$RUNNER_TEMP/tla2tools.jar" -workers 4 E2ESafePoint.tla

  # ── Required safety artifacts present ────────────────────────────────────────
  required-artifacts:
    name: Required safety artifacts present
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify required safety artifacts are present
        run: |
          missing=0
          for f in \
            .fusa.json \
            .fusa-reqs.json \
            .fusa-hara.json \
            .fusa-problems.json \
            .fusa-iec62443.json \
            SECURITY.md \
            INCIDENT-RESPONSE.md \
            SAFETY_PLAN.md \
            .github/CODEOWNERS; do
            if [ ! -f "$f" ]; then
              echo "::error::Required safety artifact missing: $f"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

  # ── Version sources agree (c-RCP-09) ─────────────────────────────────────────
  # CMakeLists.txt's project() VERSION, include/rcp/version.h's RCP_VERSION, and
  # .fusa.json's "version" are three hand-maintained copies of the same value
  # (see the header comment in version.h). Only CMakeLists.txt was reliably
  # bumped every release; version.h and .fusa.json silently fell ~184 versions
  # behind (issue c-RCP-09) because nothing checked them against each other.
  # .fusa.json's "version" in particular is what `cfusa` stamps into every
  # shipped SBOM/provenance/SPDX artifact's "module" field at release time
  # (release.yml), so letting it drift here means every artifact generated
  # from a stale .fusa.json is silently mislabeled, not just unbuilt.
  version-sources-agree:
    name: version.h / CMakeLists.txt / .fusa.json versions agree
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare the three version sources
        run: |
          cmake_version=$(grep -m1 -oE '^\s*VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          header_version=$(grep -m1 -oE '#define RCP_VERSION "[0-9]+\.[0-9]+\.[0-9]+"' include/rcp/version.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fusa_version=$(grep -m1 -oE '"version": *"[0-9]+\.[0-9]+\.[0-9]+"' .fusa.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          echo "CMakeLists.txt project() VERSION : ${cmake_version:-<not found>}"
          echo "include/rcp/version.h RCP_VERSION: ${header_version:-<not found>}"
          echo ".fusa.json \"version\"             : ${fusa_version:-<not found>}"

          fail=0
          [ -n "$cmake_version" ]  || { echo "::error file=CMakeLists.txt::Could not parse project() VERSION"; fail=1; }
          [ -n "$header_version" ] || { echo "::error file=include/rcp/version.h::Could not parse RCP_VERSION"; fail=1; }
          [ -n "$fusa_version" ]   || { echo "::error file=.fusa.json::Could not parse \"version\""; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

          if [ "$cmake_version" != "$header_version" ] || [ "$cmake_version" != "$fusa_version" ]; then
            echo "::error::Version sources disagree -- CMakeLists.txt=$cmake_version, version.h=$header_version, .fusa.json=$fusa_version. Bump all three together (see version.h's header comment); a mismatch here silently mislabels every SBOM/provenance/SPDX artifact release.yml generates from .fusa.json's stale value."
            exit 1
          fi

  # ── SPDX license headers (c-RCP-15) ───────────────────────────────────────────
  spdx-headers:
    name: SPDX-License-Identifier headers present
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify every first-party .h/.c file has an SPDX header
        run: |
          missing=0
          for f in $(find include/rcp include/relay src cli tests -type f \( -name '*.h' -o -name '*.c' \)); do
            if ! head -1 "$f" | grep -q '^/\* SPDX-License-Identifier: MPL-2\.0 \*/$'; then
              echo "::error file=$f::Missing or malformed SPDX-License-Identifier header (must be line 1)"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

  # ── LCOV coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (LCOV)
    runs-on: ubuntu-22.04
    needs: build-and-test
    outputs:
      coverage-info: coverage.info
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build lcov

      - name: Configure (coverage build)
        env:
          CC: gcc-12
        run: |
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -G Ninja

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure -j1

      - name: Collect LCOV data
        run: |
          lcov --capture \
            --directory build-cov \
            --gcov-tool gcov-12 \
            --rc lcov_branch_coverage=1 \
            --rc branch_coverage=1 \
            --output-file coverage.info
          lcov --remove coverage.info \
            '*/tests/*' '*/unity/*' '*/_deps/*' '*/cmake-build*/*' \
            --rc lcov_branch_coverage=1 \
            --rc branch_coverage=1 \
            --output-file coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info

  # ── LLVM MC/DC (real condition/decision coverage, informational only) ────────
  #
  # Issue #518 (c-RCP-16) item 3: real MC/DC evidence per ISO 26262-6:2018
  # Table 12 (MC/DC is "++" recommended at ASIL-C/D), distinct from the
  # `cfusa coverage --mcdc`/`--dal DAL-A` branch-coverage fallback used
  # elsewhere in this file, which `cfusa coverage --help` itself labels
  # "NOT verified MC/DC evidence."
  #
  # `cfusa coverage --mcdc-file` (the mechanism this job would otherwise
  # feed) cannot be used here: its parser scans for literal
  # `"covered_true_count"`/`"covered_false_count"` JSON keys that real
  # `llvm-cov export -format=text` output never contains at any LLVM
  # version -- confirmed against upstream LLVM's own
  # CoverageExporterJson.cpp (`renderMCDCRecord` emits positional arrays:
  # LineStart/ColumnStart/LineEnd/ColumnEnd/TrueDecisions/FalseDecisions/
  # FileID/ExpandedFileID/Kind/Conditions/TestVectors -- no such keys
  # anywhere in the schema) and reproduced directly end-to-end locally.
  # Filed and tracked upstream as SoundMatt/c-FuSa#129; this job does not
  # wait on that fix -- it reads `llvm-cov export`'s own `totals.mcdc`
  # block directly instead of routing through cfusa's broken parser, so
  # the number below is genuine, tool-independent MC/DC evidence today.
  #
  # Informational only, by this issue's own suggested sequencing ("land
  # it first as a reported, non-gating CI metric ... before considering
  # any hard threshold") -- matches how `cfusa trace --req-coverage` was
  # rolled out informationally between v0.2.0 and v0.53.0 before becoming
  # a hard gate. No step in this job fails the build.
  mcdc:
    name: MC/DC coverage (LLVM, informational)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 (clang/llvm-cov/llvm-profdata with MC/DC support)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y cmake ninja-build

      - name: Configure (MC/DC-instrumented build)
        env:
          CC: clang-18
        run: |
          cmake -B build-mcdc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping -fcoverage-mcdc -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -G Ninja

      - name: Build
        run: cmake --build build-mcdc --parallel

      - name: Test (profiled; one .profraw per test binary, %p/%m-namespaced)
        env:
          LLVM_PROFILE_FILE: mcdc-profiles/%p-%16m.profraw
        run: |
          mkdir -p build-mcdc/tests/mcdc-profiles
          ctest --test-dir build-mcdc --output-on-failure -j1

      - name: Merge profile data
        run: |
          llvm-profdata-18 merge -sparse \
            build-mcdc/tests/mcdc-profiles/*.profraw \
            -o mcdc.profdata

      - name: Export real MC/DC totals (llvm-cov, not cfusa --mcdc-file -- see job header)
        run: |
          bins=()
          while IFS= read -r f; do bins+=("$f"); done < <(find build-mcdc/tests -maxdepth 1 -type f -perm -u+x -name 'test_*')
          primary="${bins[0]}"
          objargs=()
          for b in "${bins[@]:1}"; do objargs+=(-object "$b"); done
          srcs=()
          while IFS= read -r f; do srcs+=("$f"); done < <(find src -name '*.c')
          llvm-cov-18 export "$primary" "${objargs[@]}" \
            -instr-profile=mcdc.profdata -format=text \
            -sources "${srcs[@]}" \
            > mcdc-export.json

      - name: Summarize MC/DC totals (non-gating)
        run: |
          python3 - <<'PYEOF'
          import json
          d = json.load(open("mcdc-export.json"))
          totals = d["data"][0]["totals"]
          mcdc = totals.get("mcdc", {})
          branch = totals.get("branches", {})
          summary = {
              "mcdc_condition_pairs_covered": mcdc.get("covered"),
              "mcdc_condition_pairs_total": mcdc.get("count"),
              "mcdc_percent": mcdc.get("percent"),
              "branch_percent_for_comparison": branch.get("percent"),
          }
          json.dump(summary, open("mcdc-summary.json", "w"), indent=2)
          print(json.dumps(summary, indent=2))
          note = (
              f"Real LLVM MC/DC (condition/decision) coverage: "
              f"{mcdc.get('percent', 0):.2f}% "
              f"({mcdc.get('covered')}/{mcdc.get('count')} condition "
              f"independence pairs) across src/*.c -- informational, "
              f"not a gate. For comparison, branch coverage over the "
              f"same instrumented binaries: "
              f"{branch.get('percent', 0):.2f}%. See job header for why "
              f"this is measured directly via llvm-cov rather than "
              f"cfusa coverage --mcdc-file (SoundMatt/c-FuSa#129)."
          )
          print(f"::notice title=MC/DC Coverage (informational)::{note}")
          with open("mcdc-summary.md", "w") as f:
              f.write("### MC/DC coverage (informational, not a gate)\n\n")
              f.write(note + "\n")
          PYEOF
          cat mcdc-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MC/DC report
        uses: actions/upload-artifact@v4
        with:
          name: mcdc-report
          path: |
            mcdc-summary.json
            mcdc-export.json

  # ── Build c-FuSa binary (shared by all cfusa-* jobs) ─────────────────────────
  cfusa-build:
    name: Build c-FuSa
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build c-FuSa from source
        run: |
          git clone --depth=1 --branch v0.6.1 https://github.com/SoundMatt/c-FuSa /tmp/cfusa
          cmake -B /tmp/cfusa/build -S /tmp/cfusa \
            -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build /tmp/cfusa/build --parallel

      - name: Upload cfusa binary
        uses: actions/upload-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build/cfusa

  # ── c-FuSa: built-in safety check (lint + analyze + cyber) ───────────────────
  #
  # Hard-gated on exit code. Previously carried continue-on-error: true here
  # because c-FuSa's CFUSA-L004 (recursion) rule had a confirmed false-positive
  # bug (fired on non-recursive functions, including empty ones) — see
  # https://github.com/SoundMatt/c-FuSa/issues/59. That was fixed upstream in
  # c-FuSa v0.5.39 (verified 2026-07-27: a fresh clone+build now reports 0
  # CFUSA-L004 findings), so the escape hatch is removed and the corresponding
  # disposition (DISP-0001) has been cleared from .fusa-dispositions.json.
  cfusa-check:
    name: cfusa check
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Safety check
        run: /tmp/cfusa/build/cfusa check

  # ── c-FuSa: MISRA-C/CERT-C lint (same fix history as check above) ────────────
  cfusa-lint:
    name: cfusa lint (MISRA-C/CERT-C)
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: MISRA-C/CERT-C lint
        run: /tmp/cfusa/build/cfusa lint

  # ── c-FuSa: static analysis (overflow, unchecked returns, ...) ───────────────
  cfusa-analyze:
    name: cfusa analyze
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Static analysis
        run: /tmp/cfusa/build/cfusa analyze

  # ── c-FuSa: CWE-mapped cybersecurity rules (ISO 21434) ───────────────────────
  cfusa-cyber:
    name: cfusa cyber
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Cybersecurity rules (ISO 21434)
        run: /tmp/cfusa/build/cfusa cyber

  # ── c-FuSa: requirements traceability (100% coverage gate) ───────────────────
  cfusa-trace:
    name: cfusa trace (100% coverage)
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Traceability check (all requirements traced)
        run: /tmp/cfusa/build/cfusa trace

      - name: Traceability gaps report
        run: /tmp/cfusa/build/cfusa trace --gaps || true

      # Both metrics are hard-gated at 100% via cfusa's own exit code:
      # `--req-coverage N` fails (exit 1) if EITHER metric 1 (requirement
      # traceability) or metric 2 (function annotation density) is below N%
      # -- no shell parsing needed, the tool's own gate covers both.
      #
      # Metric 2 has been a hard 100% gate since v0.1.0. Metric 1 was
      # intentionally left soft-gated (via `|| true`) from v0.2.0 through
      # v0.53.0 while .fusa-reqs.json forward-declared the SEOOC catalog for
      # modules not yet implemented (same spec-first pattern go-RCP/cpp-RCP
      # both used). All 43 roadmap modules are now implemented and metric 1
      # has been genuinely at 100% for several releases, so this is now a
      # real hard gate, not just a report (fixed for issue #58).
      - name: Requirement + annotation coverage report (100% hard gate, both metrics)
        run: /tmp/cfusa/build/cfusa trace --req-coverage 100

      # RELAY §20.1 item 2 also requires "every requirement traced AND
      # tested" -- the "tested" half is satisfied by ANY //cfusa:test or
      # //cfusa:sec-test trace, not just a //cfusa:req impl tag (which
      # --req-coverage above does not check). Originally gated via `cfusa
      # trace --sec-tested 100` (added issue #106, after an audit found 13
      # requirements with an impl tag but no test/sec-test tag anywhere in
      # the tree), because --sec-tested's pre-v0.6.0 implementation had a
      # bug (SoundMatt/c-FuSa#147) that made it silently count ANY test
      # tag, not just //cfusa:sec-test -- which happened to line up with
      # what this gate actually needs.
      #
      # c-FuSa v0.6.1 fixed #147: --sec-tested now correctly counts ONLY
      # //cfusa:sec-test tags, which this codebase had never populated until
      # this same PR (issue #575) -- so `--sec-tested 100` would now fail
      # outright, not because coverage regressed, but because the flag's
      # fixed semantics no longer match what this gate is checking. c-FuSa
      # v0.6.1 also has no CLI flag left exposing the general "tested"
      # metric as a hard gate -- filed upstream as SoundMatt/c-FuSa#214 --
      # so, matching this file's own MC/DC-workaround precedent above
      # (reading llvm-cov's real totals directly instead of routing through
      # a mismatched flag), this step parses plain `cfusa trace`'s own
      # "Coverage: N/N requirements traced, M/M tested" summary line
      # directly and hard-fails if either count is not 100%.
      - name: Test-trace coverage report (100% hard gate, "tested" metric)
        run: |
          out="$(/tmp/cfusa/build/cfusa trace)"
          echo "$out" | tail -5
          line="$(echo "$out" | grep -E '^Coverage: [0-9]+/[0-9]+ requirements traced, [0-9]+/[0-9]+ tested$')"
          if [ -z "$line" ]; then
            echo "::error::cfusa trace's summary line not found or not in the expected format -- cannot verify the 'tested' metric. Full output above."
            exit 1
          fi
          traced_n=$(echo "$line" | sed -E 's#Coverage: ([0-9]+)/([0-9]+).*#\1#')
          traced_d=$(echo "$line" | sed -E 's#Coverage: ([0-9]+)/([0-9]+).*#\2#')
          tested_n=$(echo "$line" | sed -E 's#.*, ([0-9]+)/([0-9]+) tested#\1#')
          tested_d=$(echo "$line" | sed -E 's#.*, ([0-9]+)/([0-9]+) tested#\2#')
          if [ "$traced_n" != "$traced_d" ] || [ "$tested_n" != "$tested_d" ]; then
            echo "::error::'tested' metric gate failed: $line (both counts must be equal for a 100% gate)"
            exit 1
          fi
          echo "OK: $line"

      # Genuine security-test coverage (distinct from the general "tested"
      # gate above): CYBERSECURITY.md's own six security layers cite exactly
      # 37 requirement ids as security-relevant (REQ-AUTH-001..008,
      # REQ-E2E-011/012/014/015/020..027, REQ-DISC-015..022,
      # REQ-RMAP-009..012, REQ-LIFECYCLE-018..020, REQ-RL-003/004), each now
      # carrying a real //cfusa:sec-test tag alongside its existing
      # //cfusa:test tag (issue #575). 37/1271 = 2.91%,
      # hence the 2% floor -- NOT a claim that only 2% of this codebase is
      # security-relevant; it is a regression floor against the exact,
      # CYBERSECURITY.md-enumerated subset, low by construction since most
      # of a protocol-plumbing library's requirements genuinely are not
      # security-relevant. Raise this number only alongside a corresponding
      # CYBERSECURITY.md layer addition, never by tagging more broadly than
      # that document's own boundary.
      - name: Security-test coverage report (2% floor, real CYBERSECURITY.md subset)
        run: /tmp/cfusa/build/cfusa trace --sec-tested 2

  # ── c-FuSa: ctest integration → test-evidence.md ─────────────────────────────
  cfusa-verify:
    name: cfusa verify (test evidence)
    runs-on: ubuntu-22.04
    needs: [build-and-test, cfusa-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Configure
        env:
          CC: gcc-12
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j1

      - name: Generate test evidence bundle
        run: /tmp/cfusa/build/cfusa verify

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: test-evidence.md

  # ── c-FuSa: tool qualification suite ──────────────────────────────────────────
  cfusa-qualify:
    name: cfusa qualify
    runs-on: ubuntu-22.04
    needs: cfusa-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Tool qualification
        run: |
          /tmp/cfusa/build/cfusa qualify \
            --qualification-method self \
            --qualifier "c-RCP CI (self-run, non-independent)" \
            --implementation-author "SoundMatt/c-RCP maintainers"

  # ── c-FuSa: known-vulnerable function pattern scan ───────────────────────────
  cfusa-vuln:
    name: cfusa vuln
    runs-on: ubuntu-22.04
    needs: cfusa-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Vulnerability pattern scan
        run: /tmp/cfusa/build/cfusa vuln

  # ── c-FuSa: change impact analysis on PRs ────────────────────────────────────
  cfusa-impact:
    name: cfusa impact (change analysis)
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    needs: [cfusa-build, cfusa-trace]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Change impact analysis
        run: /tmp/cfusa/build/cfusa impact || true

  # ── c-FuSa: full compliance report (aggregated) ──────────────────────────────
  cfusa-report:
    name: cfusa report (compliance)
    runs-on: ubuntu-22.04
    needs:
      - build-and-test
      - coverage
      - cfusa-analyze
      - cfusa-cyber
      - cfusa-trace
      - cfusa-verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cfusa-binary
          path: /tmp/cfusa/build

      - run: chmod +x /tmp/cfusa/build/cfusa

      - name: Download coverage info
        uses: actions/download-artifact@v4
        with:
          name: coverage-info
          path: .

      # Best-effort by design, not masking a real gate: DAL-B requires 100%
      # line + 100% branch coverage, and this project is not there yet
      # (currently ~93% line / ~80% branch -- see coverage-report.json,
      # which is committed and does self-report FAIL against DAL-B
      # deliberately, as an honest, visible artifact of that gap). This
      # step exists to keep producing that report for the record, not to
      # gate the build on a target not yet met. The "Coverage regression
      # gate" step right below it is the actual hard gate (issue
      # c-RCP-N2-05 / #132): it enforces a real, currently-met floor so a
      # PR can't silently regress coverage while DAL-B itself remains a
      # tracked, not-yet-closed goal (c-RCP-11 / #123).
      - name: Structural coverage report (DO-178C, informational)
        run: /tmp/cfusa/build/cfusa coverage --lcov coverage.info --dal DAL-B --output coverage-report.json || true

      # The real gate: hard-fails if line coverage drops below a floor
      # comfortably under the currently-measured ~93% (leaving margin for
      # cross-toolchain lcov/gcov variance), so this at least prevents
      # regression while the project works toward full DAL-B. Not itself
      # a DAL-B compliance claim -- see the step above.
      #
      # Raised 88 -> 90 (issue #520 / c-RCP-19, category 1/2 batches):
      # local coverage build matching this job's exact lcov invocation
      # measured 92.69% line coverage after closing adapt.c/loan.c/tsn.c/
      # shmem.c/ep_can.c's dispatch-table and malformed-input gaps. 90
      # keeps a real cross-toolchain margin below that re-measured
      # number.
      - name: Coverage regression gate (line floor, not DAL-B)
        run: /tmp/cfusa/build/cfusa coverage --lcov coverage.info --threshold 90

      - name: Full compliance report (JSON)
        run: /tmp/cfusa/build/cfusa report --format json --output report.json || true

      - name: Full compliance report (SARIF)
        run: /tmp/cfusa/build/cfusa report --format sarif --output results.sarif || true

      - name: Safety metrics snapshot
        run: /tmp/cfusa/build/cfusa metrics record || true

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: |
            report.json
            results.sarif
            coverage-report.json
